       so use app-icon-maskable.svg for Play Store / adaptive exports. -->
  <rect x="48" y="48" width="928" height="928" rx="224" fill="#0a0b0d" stroke="#d6ff3f" stroke-width="48"/>
  <text x="512" y="496" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-style="normal" font-weight="700" font-size="704" fill="#d6ff3f">?</text>
</svg>
